[package]
name = "mdview"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A simple Markdown viewer for the COSMIC desktop"

[dependencies]
env_logger = "0.11"
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
log = "0.4"
notify-debouncer-full = { version = "0.7", default-features = false }
open = "5"
# Same version as libcosmic's markdown widget; only its `Alignment` type is used.
pulldown-cmark = { version = "0.12", default-features = false }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "plist-load", "regex-onig"] }
tokio = { version = "1", features = ["fs", "rt"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
url = "2"

[dependencies.cosmic-syntax-theme]
git = "https://github.com/pop-os/cosmic-syntax-theme.git"
rev = "b1e1eb0234568911e59888f092dfc779c609b499"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "5a8bd9482a35ae94c1e54edf77b331c6b970f170"
default-features = false
features = [
    "about",
    "dbus-config",
    "markdown",
    "multi-window",
    "tokio",
    "wayland",
    # GPU rendering; without it iced falls back to tiny-skia on the CPU, which
    # makes scrolling sluggish.
    "wgpu",
    "winit",
    "xdg-portal",
]

[dev-dependencies]
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "time"] }

[profile.release]
lto = "thin"
